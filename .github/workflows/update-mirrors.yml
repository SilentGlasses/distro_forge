name: Prune unreachable mirrors

on:
  # Weekly on Wednesday 06:00 UTC (different day than releases updater).
  schedule:
    - cron: "0 6 * * 3"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-mirrors
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          #cache: npm

      - name: Assert Node version
        run: node -v | grep -E "^v24\."

      - name: Verify Node version
        run: node -v

      - name: Run mirror health check
        id: check
        run: node scripts/update-mirrors.mjs | tee /tmp/mirror-report.txt

      # PRs opened with GITHUB_TOKEN don't trigger other workflows, so the
      # smoke tests would never run on this PR.
      - name: Run contract tests on regenerated data
        run: node --test tests/contracts/*.test.mjs

      - name: Enforce transport security policy
        run: node scripts/check-transport-security.mjs

      - name: Open PR if any mirrors were pruned
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: automation/prune-mirrors
          base: main
          title: "chore(mirrors): prune unreachable entries"
          commit-message: "chore(mirrors): prune unreachable entries"
          body-path: /tmp/mirror-report.txt
          labels: mirror-data
          add-paths: assets/data/mirrors-list.js
          delete-branch: true
          sign-commits: true
