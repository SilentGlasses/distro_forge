name: Update supported releases

on:
  # Weekly on Monday 06:00 UTC.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-releases
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          #cache: npm

      - name: Assert Node version
        run: node -v | grep -E "^v24\."

      - name: Verify Node version
        run: node -v

      - name: Regenerate assets/data/releases.js
        run: node scripts/update-releases.mjs

      # PRs opened with GITHUB_TOKEN don't trigger other workflows, so the
      # smoke tests would never run on this PR.
      - name: Run contract tests on regenerated data
        run: node --test tests/contracts/*.test.mjs

      - name: Enforce transport security policy
        run: node scripts/check-transport-security.mjs

      - name: Open a PR if release data changed
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: automation/update-releases
          base: main
          title: "chore(releases): refresh supported-release data"
          commit-message: "chore(releases): refresh supported-release data"
          body-path: .release-notes.md
          labels: release-data
          add-paths: assets/data/releases.js
          delete-branch: true
          # Commit via the API so the commit is signed as github-actions[bot]
          # and passes a "Require signed commits" rule on main.
          sign-commits: true
